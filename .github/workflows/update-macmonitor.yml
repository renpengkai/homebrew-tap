name: update-macmonitor

# 跨仓库触发需要额外 token, 这里改为定时轮询上游最新 Release; 发版后也可手动触发:
#   gh workflow run update-macmonitor.yml -R renpengkai/homebrew-tap
on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump cask to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cask=Casks/macmonitor.rb
          tag=$(gh release view --repo renpengkai/macmonitor --json tagName -q .tagName)
          version="${tag#v}"
          current=$(sed -nE 's/^  version "([^"]+)"/\1/p' "$cask")
          if [[ "$version" == "$current" ]]; then
            echo "already at $version"
            exit 0
          fi
          url="https://github.com/renpengkai/macmonitor/releases/download/${tag}/MacMonitor-${version}.zip"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          sed -i -E \
            -e "s/^  version \".*\"/  version \"${version}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" \
            "$cask"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "macmonitor ${version}"
          git push
          # GITHUB_TOKEN 推送的提交不会触发 push 事件的工作流, 需显式触发安装测试
          gh workflow run tests.yml --ref main
